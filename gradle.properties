org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Classic Kotlin plugin model (Kotlin 2.4.10) instead of AGP 9's built-in Kotlin + new DSL.
# TODO: migrate to built-in Kotlin before AGP 10 removes these opt-outs.
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official
